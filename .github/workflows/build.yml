name: Build APK v3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f NothingLauncher.zip ]; then
            mkdir -p _proj
            unzip -o NothingLauncher.zip -d _proj
          fi

      - name: Find project
        id: find
        run: |
          F=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts NOT FOUND. Files in repo:"
            ls -R | head -n 50
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> $GITHUB_OUTPUT
          echo "Project dir: $(dirname "$F")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NothingLauncher-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
