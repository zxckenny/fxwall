name: Build FxWall APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile FxWall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP if needed
        run: |
          ZIP=$(find . -maxdepth 2 -name "FxWall_Launcher_v4.zip" -print -quit)
          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
          fi

      - name: Locate project
        run: |
          FILE=$(find . -name settings.gradle.kts \
            -not -path "*/.git/*" -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle project not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project found: $DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FxWall-v4-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
