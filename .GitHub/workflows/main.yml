name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Найти проект
        id: proj
        run: |
          if [ -f settings.gradle.kts ]; then echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f FxWall/settings.gradle.kts ]; then echo "dir=FxWall" >> "$GITHUB_OUTPUT"
          else echo "ИСХОДНИКИ НЕ НАЙДЕНЫ: в репозитории нет settings.gradle.kts" && exit 1; fi
      - run: gradle assembleDebug
        working-directory: ${{ steps.proj.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: FxWall-apk
          path: ${{ steps.proj.outputs.dir == '.' && 'app/build/outputs/apk/debug/app-debug.apk' || format('{0}/app/build/outputs/apk/debug/app-debug.apk', steps.proj.outputs.dir) }}
